name: Farm health
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trueclock-lab-health
  cancel-in-progress: false
jobs:
  health:
    if: github.repository == 'Avi-Patel-1/trueclock-lab' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect runner receipt
        run: python3 tools/health.py
      - name: Upload the bounded receipt
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/health.json
          if-no-files-found: error
          retention-days: 1
