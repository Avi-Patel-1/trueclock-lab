name: Physical build
run-name: Physical ${{ inputs.job_id }} slot ${{ inputs.slot }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Committed job identifier
        type: string
        required: true
      commit:
        description: Reviewed release commit
        type: string
        required: true
      request_sha256:
        description: Admitted job digest
        type: string
        required: true
      approval_sha256:
        description: Admitted grant digest
        type: string
        required: true
      lease_deadline:
        description: Absolute UTC expiry of this reservation
        type: string
        required: true
      slot:
        description: Reserved standard-runner slot
        type: choice
        options: ['0', '1', '2', '3']
        required: true
permissions:
  contents: read
concurrency:
  group: trueclock-lab-physical-${{ inputs.slot }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository_id == '1446511200' && github.repository == 'Avi-Patel-1/trueclock-lab' && github.actor_id == '137302645' && github.ref == 'refs/heads/main' && github.sha == inputs.commit && github.run_attempt == '1' && contains(fromJSON('["0","1","2","3"]'), inputs.slot)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JOB_ID: ${{ inputs.job_id }}
      TRUECLOCK_LEASE_DEADLINE: ${{ inputs.lease_deadline }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
    steps:
      - name: Check out the admitted release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the guarded build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[a-z0-9][a-z0-9_-]{0,62}$ ]]
          [[ "$REQUEST_SHA256" =~ ^[0-9a-f]{64}$ && "$APPROVAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/run_flow.py --request "jobs/$JOB_ID.json" --request-sha256 "$REQUEST_SHA256" --approval-sha256 "$APPROVAL_SHA256"
      - name: Collect generated evidence
        if: always()
        run: python3 tools/pack_evidence.py
      - name: Return the result package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected/result.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
